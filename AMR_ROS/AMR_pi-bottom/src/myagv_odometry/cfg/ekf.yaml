ekf_filter_node:
  frequency: 30.0
  sensor_timeout: 0.1
  two_d_mode: true

  publish_tf: true
  map_frame: map
  odom_frame: odom
  base_link_frame: base_link
  world_frame: odom

  # ---------- INPUT 1: internal odom ----------
  odom0: /internal_imu_odom
  odom0_config: [true, true, false,
                 false, false, true,
                 true, true, false,
                 false, false, false,
                 false, false, false]
  odom0_queue_size: 10
  odom0_relative: false

  # ---------- INPUT 2: external IMU ----------
  imu0: /external_imu
  imu0_differential: false
  imu0_queue_size: 10
  imu0_remove_gravitational_acceleration: true

  imu0_config: [false, false, false,
                true, true, true,
                false, false, false,
                false, false, false,
                true, true, true]

